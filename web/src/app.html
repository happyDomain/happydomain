<!DOCTYPE html>
<html lang="en" class="d-flex flex-column h-100">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f4f5f5" media="(prefers-color-scheme: light)"/>
    <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png">
    <meta property="og:url" content="https://www.happydomain.org/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="HappyDomain">
    <meta property="og:description" content="Finally a simple interface for domain names.">
    <meta property="og:image" content="https://www.happydomain.org/img/og.webp">
    <script>
      // Follow the system colour scheme; Bootstrap reads data-bs-theme.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.setAttribute("data-bs-theme", mq.matches ? "dark" : "light");
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    <style>
      #app-splash,
      #app-splash * {
        box-sizing: border-box;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background-color: #fffff7;
        animation: app-splash-appear 0.25s ease 0.3s both;
      }
      /* The loader is the logo mark itself: its five tiles light up one after
         the other, tracing a loop around the mark. --i is the tile's rank in
         that loop; the inline script below rotates the ranks so the tour
         starts on a different tile at each load. */
      #app-splash-loader {
        /* The mark barely breathes: it rests at its true size, so the
           splash matches the static logo, and peaks just over it, the colour
           carrying most of the signal. Tiles sit 13.7 units apart, and a
           peak of 1.1 eats 5.1 units on each side, so even two neighbours at
           full swell stay clear of one another. */
        --rest: 1;
        --peak: 1.1;
        --cycle: 1.5s;
        /* Tiles rest on a pale green and flash to the brand green. */
        --tile-rest: #b5e8d3;
        --tile-peak: #00aa7d;
        display: block;
        width: 300px;
        max-width: 80vw;
        height: auto;
        /* Tiles at full swell overhang the viewBox on its left and top. */
        overflow: visible;
      }
      #app-splash-loader rect {
        fill: var(--tile-rest);
        transform-box: fill-box;
        transform-origin: center;
        transform: scale(var(--rest));
        animation: app-splash-pulse var(--cycle) linear infinite;
        animation-delay: calc(var(--i, 0) * var(--cycle) / 5);
      }
      #app-splash-loader rect:nth-of-type(1) { --i: 0; }
      #app-splash-loader rect:nth-of-type(2) { --i: 1; }
      #app-splash-loader rect:nth-of-type(3) { --i: 2; }
      #app-splash-loader rect:nth-of-type(4) { --i: 3; }
      #app-splash-loader rect:nth-of-type(5) { --i: 4; }
      @media (prefers-color-scheme: dark) {
        #app-splash { background-color: #282828; }
        /* On the dark canvas the pale green glares: rest on a deep green
           instead (green-800, the dark theme's accent border), so only the
           lit tile stands out. */
        #app-splash-loader { --tile-rest: #00543a; }
      }
      @keyframes app-splash-appear {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* Grows and saturates fast, then eases back while the next tile is
         already on its way up, the two overlap, so the tour never stalls. */
      @keyframes app-splash-pulse {
        0% {
          transform: scale(var(--rest));
          fill: var(--tile-rest);
          animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        10% {
          transform: scale(var(--peak));
          fill: var(--tile-peak);
          animation-timing-function: cubic-bezier(0.4, 0, 0.6, 1);
        }
        34%, 100% {
          transform: scale(var(--rest));
          fill: var(--tile-rest);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        /* Same relay, colour only: nothing moves or resizes. */
        #app-splash-loader rect {
          --cycle: 3s;
          transform: none;
          animation-name: app-splash-relay;
        }
        @keyframes app-splash-relay {
          0%, 100% { fill: var(--tile-rest); }
          10% { fill: var(--tile-peak); }
          34% { fill: var(--tile-rest); }
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body>
    <noscript>
      <strong>We're sorry but happyDomain doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app-splash">
      <!-- One drawing in the coordinates of the full logo (882 x 221): the
           wordmark sits where it does in the original, and the tiles are the
           original mark. Tiles are ordered along the tour, not by position:
           bottom-left, top-right, top-left, bottom-right, centre, then round
           again. -->
      <svg id="app-splash-loader" viewBox="0 0 882 221" role="status" aria-label="Loading">
        <image href="%sveltekit.assets%/img/happyDomain-text-stacked.svg" x="409" y="0" width="473" height="221" />
        <rect x="0" y="116.73" width="102.765" height="102.988" rx="38.2391" ry="38.3217" />
        <rect x="232.91" y="0" width="102.765" height="102.988" rx="38.2391" ry="38.3217" />
        <rect x="0" y="0" width="102.765" height="102.988" rx="38.2391" ry="38.3217" />
        <rect x="232.91" y="116.73" width="102.765" height="102.988" rx="38.2391" ry="38.3217" />
        <rect x="116.478" y="58.3945" width="102.765" height="102.988" rx="38.2391" ry="38.3217" />
      </svg>
    </div>
    <script>
      // Rotate the tour so it does not always start on the same tile.
      (function () {
        var tiles = document.querySelectorAll("#app-splash-loader rect");
        var start = Math.floor(Math.random() * tiles.length);
        for (var i = 0; i < tiles.length; i++) {
          tiles[i].style.setProperty("--i", (i - start + tiles.length) % tiles.length);
        }
      })();
    </script>
    <div class="d-flex flex-column flex-fill">%sveltekit.body%</div>
  </body>
</html>
