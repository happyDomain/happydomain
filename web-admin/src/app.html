<!DOCTYPE html>
<html lang="en" class="d-flex flex-column h-100">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width">
    <link rel="icon" href="/favicon.ico" />
    <meta name="theme-color" content="#c24640"/>
    <meta name="robots" content="noindex, nofollow">
    <script>
      // Follow the system colour scheme; Bootstrap reads data-bs-theme.
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        function apply() {
          document.documentElement.setAttribute("data-bs-theme", mq.matches ? "dark" : "light");
        }
        apply();
        mq.addEventListener("change", apply);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body>
    <noscript>
      <strong>We're sorry but happyDomain Admin doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div class="d-flex flex-column flex-fill">%sveltekit.body%</div>
  </body>
</html>
